name: Publish npm

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing

jobs:
  publish:
    if: github.repository == 'besarrahmat/policy-semver'
    runs-on: ubuntu-latest
    timeout-minutes: 15 # GitHub-hosted required; self-hosted is not supported
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        # Reads version from root package.json "packageManager"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version # must resolve to Node 24+
          cache: pnpm
          # Do NOT set registry-url when using Trusted Publishing without NODE_AUTH_TOKEN.
          # setup-node writes _authToken=${NODE_AUTH_TOKEN}; empty token → ENEEDAUTH.

      - run: npm install -g npm@12.2.1 # trusted publishing needs npm CLI >= 11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Assert GitHub VERSION and npm packages match
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          ROOT=$(node -p "require('./package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          CORE=$(node -p "require('./packages/core/package.json').version")
          test "$VERSION" = "$ROOT"
          test "$VERSION" = "$CLI"
          test "$VERSION" = "$CORE"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}"
          fi

      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:fixtures

      # Versions are immutable, so a rerun after a partial publish skips what landed.
      - name: Publish @policy-semver/core
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if npm view "@policy-semver/core@$VERSION" version >/dev/null 2>&1; then
            echo "@policy-semver/core@$VERSION is already published"
          else
            pnpm --filter '@policy-semver/core' publish --access public --no-git-checks
          fi
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Publish policy-semver
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if npm view "policy-semver@$VERSION" version >/dev/null 2>&1; then
            echo "policy-semver@$VERSION is already published"
          else
            pnpm --filter policy-semver publish --access public --no-git-checks
          fi
        env:
          NPM_CONFIG_PROVENANCE: "true"
