# PolicySemVer — GitHub Action metadata (layout A)
#
# Canonical entry for `uses: org/policy-semver@ref` and Marketplace.
# Sources: packages/action/ · bundle: dist/index.js
# Locks: packages/action/src/locks.ts · marketplace-locks.ts
# Do not rename this file to action.yaml after a Marketplace listing exists.
name: PolicySemVer
description: Policy-first SemVer for deployed apps; major only via APP_VERSION_MAJOR
author: Besar Rahmat
branding:
  icon: tag
  color: blue
inputs:
  config-path:
    description: Path to versioning.config.json
    default: versioning.config.json
  dry-run:
    description: Force dry-run even on merge
    required: false
    default: "false"
  token:
    description: GitHub token (PAT/App) when GITHUB_TOKEN cannot push
    required: false
    default: ${{ github.token }}
outputs:
  kind:
    description: Classification kind
  next-version:
    description: Computed next version if any
  skipped-reason:
    description: Why write was skipped if any
runs:
  using: node24
  main: dist/index.js
