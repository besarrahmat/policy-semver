# Dogfood / path-based uses only (`uses: ./packages/action`).
# Canonical Marketplace metadata is repo-root action.yml (layout A).
# name / description / branding / inputs / outputs must match root action.yml;
# only `runs.main` differs (committed root bundle).
name: PolicySemVer
description: Policy-first SemVer for deployed apps; major only via APP_VERSION_MAJOR
author: Besar Rahmat
branding:
  icon: tag
  color: blue
inputs:
  config-path:
    description: Path to versioning.config.json
    default: versioning.config.json
  dry-run:
    description: Force dry-run even on merge
    required: false
    default: "false"
  token:
    description: GitHub token for the API (Release, PR comment). git push uses the credentials of actions/checkout
    required: false
    default: ${{ github.token }}
outputs:
  kind:
    description: Classification kind
  next-version:
    description: Computed next version if any
  current-version:
    description: Version before this run
  skipped-reason:
    description: Why write was skipped if any
  tag:
    description: Tag of the release, if this run released or finished one
  released:
    description: "'true' if the release is complete, including the GitHub Release"
runs:
  using: node24
  main: ../../dist/index.js
