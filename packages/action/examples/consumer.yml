name: PolicySemVer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  # Merge-queue checks are dry-run only: the queue's SHA may never land.
  # The release itself runs on the PR's closed+merged event.
  merge_group:

# serialize writes on the same prod base (not github.ref — that is refs/pull/N/merge).
# never cancel mid-bump. queue: max so a new run waits instead of replacing a pending
# release (the default keeps one pending run). fetch-depth: 0 so reruns find earlier releases.
concurrency:
  group: policy-semver-${{ github.repository }}-${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    if: github.event.pull_request.base.ref == 'main' || github.event.merge_group.base_ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # git push uses this checkout token. If github-actions[bot] cannot
          # push protected prod, set a contents:write PAT/App here (not the Action-repo read PAT).
          # token: ${{ secrets.POLICY_SEMVER_WRITE_TOKEN }}
      # Canonical Action repo is public (Marketplace layout A). Pin a 40-character SHA.
      - uses: besarrahmat/policy-semver@<full-commit-sha>
        env:
          APP_VERSION_MAJOR: ${{ vars.APP_VERSION_MAJOR }}
        with:
          config-path: versioning.config.json
          # token: ${{ secrets.POLICY_SEMVER_TOKEN }}  # contents:write on THIS repo if github-actions[bot] cannot push

      # Private fork: `uses: owner/policy-semver@ref` 404s from another repo.
      # Replace the uses: step above with a checkout + local uses:
      # - name: Checkout PolicySemVer action
      #   uses: actions/checkout@v7
      #   with:
      #     repository: besarrahmat/policy-semver
      #     ref: <full-commit-sha>
      #     token: ${{ secrets.POLICY_SEMVER_TOKEN }}
      #     path: .github/actions/policy-semver
      #     persist-credentials: false
      # - name: PolicySemVer
      #   uses: ./.github/actions/policy-semver
      #   env:
      #     APP_VERSION_MAJOR: ${{ vars.APP_VERSION_MAJOR }}
      #   with:
      #     config-path: versioning.config.json
  # never build/deploy if the bump job failed or was skipped.
  build:
    needs: version
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - run: echo "inject VERSION into the build; do not read version from CDN at runtime"

  deploy:
    needs: build
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - run: echo "deploy after successful build"
